name: Snapshot
# Publishes a snapshot Docker image to test a change before a release.
#
# - Pushes from the repository owner are published straight away
#   (tags snapshot-<branch> and snapshot-<short sha>).
# - Pull requests from forks are published as snapshot-pr-<number>, only once the
#   owner approves the run: the job uses the `docker-snapshot` environment, which
#   must have the owner as required reviewer (checked by the `guard` job).
#
# Security notes for pull_request_target:
# - this workflow file is always taken from the base branch, a PR cannot change it
# - the PR code is only checked out after approval, without git credentials, and
#   only runs inside the Docker build, which has no access to the runner (docker login)
# - no build cache is used: exporting it took longer than building the image,
#   and PR builds could otherwise poison it
on:
  push:
    branches:
      - '**'
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: thibmarechal/turborepo-remote-cache

jobs:
  push:
    name: 📸 Snapshot (push)
    if: ${{ github.event_name == 'push' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,prefix=snapshot-
            type=sha,prefix=snapshot-

      - name: 🐳 Docker build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: an emulated arm64 build takes ~30 minutes
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  guard:
    name: 🛡️ Check approval gate
    # PRs from branches of this repository are already covered by the push job
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      deployments: read
    steps:
      # Fail closed: if the environment is missing or has no required reviewer,
      # GitHub would run the job without asking for an approval.
      - name: 🛡️ Require reviewers on the docker-snapshot environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${{ github.repository }}/environments/docker-snapshot" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length') || reviewers=0
          if [ "$reviewers" = "0" ]; then
            echo "::error::The docker-snapshot environment must exist and have required reviewers."
            exit 1
          fi

  pull-request:
    name: 📸 Snapshot (pull request)
    needs: guard
    runs-on: ubuntu-latest
    # Waits for the owner's approval before any step runs
    environment: docker-snapshot
    steps:
      - name: ⬇️ Checkout PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Docker build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: an emulated arm64 build takes ~30 minutes
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:snapshot-pr-${{ github.event.pull_request.number }}
